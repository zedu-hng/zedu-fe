# Maps bootcamp teams to their leads.
# - team-routing.yml reads this to request the team lead's review.
# - lead-approval.yml reads this to set the "Lead approved" status.
# - reviewer-notify.yml reads the keys to know which forks are teams.
# A PR's team is the owner of its head fork (the org an intern forked into), matched to a key below
# case-insensitively: a key must equal the fork org's login (e.g. zedu-flamingo). A fork that isn't
# listed here isn't routed and can't be lead-approved. Reviewers are NOT listed here: once a PR is
# lead-approved and its checks pass, reviewer-notify.yml mentions the reviewers team and any
# reviewer can claim the PR with /claim.
#
# teams:
#   fork-owner-name:            # exactly the fork org's login, e.g. zedu-flamingo
#     leads:                    # one or more; any one can approve, so a single absence isn't a blocker
#       - lead-handle           # plain login, no @
#
# Teams are added as they register.

