name: Lead approval relay

# Re-checks Lead approved right after a review (see lead-approval-review.yml) by dispatching
# lead-approval.yml for that PR. Trusted: runs from the default branch with the base repo's token
# and never checks out PR code. Lead approval's scheduled sweep remains as a fallback.

on:
  workflow_run:
    workflows: ["Lead approval review"]
    types:
      - completed

permissions:
  actions: write
  pull-requests: read

jobs:
  relay:
    name: Re-check lead approval
    if: vars.IS_BOOTCAMP == 'true' && github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Dispatch Lead approval for the reviewed PR
        run: |
          # Same-repo runs list their PR; fork runs don't, so match the open PR by head commit.
          pr=$(jq -c '.[0] // empty' <<< "$RUN_PRS")
          if [ -n "$pr" ]; then
            number=$(jq -r .number <<< "$pr"); base=$(jq -r .base.ref <<< "$pr")
          else
            read -r number base < <(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
              | jq -rs --arg s "$HEAD_SHA" 'flatten | map(select(.head.sha == $s))[0] // empty | "\(.number) \(.base.ref)"') || true
          fi
          if [ -z "${number:-}" ]; then echo "No open PR has head $HEAD_SHA; nothing to re-check."; exit 0; fi
          case "$base" in
            dev|central-staging) ;;
            *) echo "PR #$number targets $base; Lead approval doesn't apply."; exit 0 ;;
          esac
          gh workflow run lead-approval.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" -f pr="$number" -f base_ref="$base"
          echo "Re-checking Lead approved for PR #$number."
