name: PR checks

# Review-org replacement for Zedu's "PR pre-commit checks", "PR Review Bot", the file-policy / audit /
# gitleaks half of "Security checks", the heuristics half of "Malware scan", our Commitlint and our
# FE preview build. Those workflows are disabled in zedu-hng (their files stay as upstream, so syncs
# don't conflict); semgrep and ClamAV run in pr-scans.yml.
#
# Why: the org's 4 repos share 20 runner slots, and one push used to start 11 jobs here, run
# `pnpm install` four times and build the app twice. This is one job: checkout and install once, run
# every check (each one runs even if an earlier one fails), build once, and package that build as
# the preview image for preview-eligible PRs.
#
# Untrusted: runs PR code with a read-only token. It only uploads artifacts:
#   pr-checks-results  per-check results; pr-review-comment.yml posts them as commit statuses
#   pr-review-report   the review bot's report, posted as a PR comment by the same workflow
#   fe-preview         meta.json (+ image.tar.gz); fe-preview-deploy.yml deploys it
# Zedu's scripts (verify-changed-files.sh, scan-malware.mjs, pr-review/) are called unchanged.
#
# A `preview` label or a Backend URL edit only rebuilds the preview: checks are skipped and no
# results are uploaded, so their statuses stay as they were for the commit.

on:
  pull_request:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - edited

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    # Coarse filter: unrelated labels and title-only edits take no runner.
    if: >-
      github.repository == 'zedu-hng/zedu-fe' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview') &&
      (github.event.action != 'edited' || github.event.changes.body != null)
    # A push restarts the full run for this PR; a preview label restarts a preview rebuild. Body edits
    # get a group of their own: whether an edit matters (Backend URL changed) is only known inside the
    # job, so a template tick must not cancel a running rebuild. Deploy ignores an image built for a
    # backend the PR no longer asks for.
    concurrency:
      group: >-
        pr-checks-${{ github.event.pull_request.number }}-${{
          contains(fromJSON('["opened", "synchronize", "reopened", "ready_for_review"]'), github.event.action) && 'full' ||
          (github.event.action == 'edited' && format('edit-{0}', github.run_id) || 'preview') }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      DRAFT: ${{ github.event.pull_request.draft }}
      ACTION: ${{ github.event.action }}
      LABEL: ${{ github.event.label.name }}
      LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      PR_BODY: ${{ github.event.pull_request.body }}
      BODY_FROM: ${{ github.event.changes.body.from }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # full: a code event; every check runs. preview: a preview label or Backend URL edit; only the
      # preview is rebuilt. none: a body edit that left the Backend URL line alone.
      - name: Decide
        id: mode
        run: |
          bline() {
            local l
            l=$(printf '%s\n' "$1" | tr -d '\r' | grep -iE '^[[:space:]]*backend url:' | head -1 || true)
            [ -n "$l" ] || { echo none; return 0; }
            echo "line:$(sed -E 's/^[[:space:]]*[Bb][Aa][Cc][Kk][Ee][Nn][Dd] [Uu][Rr][Ll]:[[:space:]]*//; s/[[:space:]`<>]//g; s#/+$##' <<< "$l")"
          }
          case "$ACTION" in
            labeled) mode=preview ;;
            edited) if [ "$(bline "$BODY_FROM")" = "$(bline "$PR_BODY")" ]; then mode=none; else mode=preview; fi ;;
            *) mode=full ;;
          esac
          echo "Event $ACTION: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # Preview config comes from the base branch, never from the PR.
      - name: Preview gate
        id: meta
        if: steps.mode.outputs.mode != 'none'
        run: |
          cfg="$RUNNER_TEMP/cfg"; mkdir -p "$cfg"
          git fetch -q --no-tags origin "$BASE_REF"
          for f in preview.env preview-orgs preview/Dockerfile; do
            git show "FETCH_HEAD:.github/$f" > "$cfg/$(basename "$f")" 2>/dev/null || { echo "No .github/$f on $BASE_REF; previews not set up."; exit 0; }
          done
          get() { sed -n "s/^$1=//p" "$cfg/preview.env" | head -1; }
          [ "$(get PREVIEW_ENABLED)" = true ] || { echo "PREVIEW_ENABLED isn't true on $BASE_REF; no preview."; exit 0; }
          [ "$DRAFT" != true ] || { echo "Draft PR; no preview."; exit 0; }

          org=${HEAD_REPO%%/*}
          if [ "$HEAD_REPO" = "$REPO" ]; then gate=reviewer
          elif grep -v '^#' "$cfg/preview-orgs" | grep -qixF "$org"; then gate=registered
          elif jq -e 'index("preview") != null' <<< "$LABELS" >/dev/null; then gate=label
          else gate=skip; fi

          host=$(get PREVIEW_BACKEND_HOST); override=false; error=""
          line=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -iE '^[[:space:]]*backend url:' | head -1 || true)
          if [ -n "$line" ]; then
            url=$(sed -E 's/^[[:space:]]*[Bb][Aa][Cc][Kk][Ee][Nn][Dd] [Uu][Rr][Ll]:[[:space:]]*//; s/[[:space:]`<>]//g; s#/+$##' <<< "$line")
            if [[ "$url" =~ ^https://(api\.[a-z0-9-]+\.groups\.zedu\.chat)$ ]]; then
              host=${BASH_REMATCH[1]}; override=true
            else
              error="Backend URL must look like https://api.<name>.groups.zedu.chat"
            fi
          fi
          wanted=$([ "$gate" != skip ] && [ -z "$error" ] && echo true || echo false)

          jq -n --arg pr "$PR" --arg sha "$SHA" --arg org "$org" --arg gate "$gate" --arg host "$host" \
            --argjson override "$override" --arg error "$error" --arg action "$ACTION" --arg label "$LABEL" \
            --argjson wanted "$wanted" \
            '{pr: ($pr|tonumber), sha: $sha, org: $org, gate: $gate, backend_host: $host,
              override: $override, error: $error, action: $action, label: $label, wanted: $wanted, image: false}' > meta.json
          cat meta.json
          {
            echo "upload=true"; echo "wanted=$wanted"; echo "host=$host"
            echo "domain=$(get PREVIEW_DOMAIN)"; echo "cfg=$cfg"
          } >> "$GITHUB_OUTPUT"

      # Checks that read the tree as the PR left it run before install (no node_modules to scan).
      - name: File policy
        id: file_policy
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        run: bash .github/scripts/verify-changed-files.sh "origin/$BASE_REF" HEAD

      - name: Gitleaks
        id: gitleaks
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        run: |
          GITLEAKS_VERSION="8.24.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --no-git --config .gitleaks.toml --redact --no-banner

      - name: Malware heuristics
        id: heuristics
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        run: node .github/scripts/scan-malware.mjs

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.mode.outputs.mode == 'full' || steps.meta.outputs.wanted == 'true'
        with:
          version: 10.27.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.mode.outputs.mode == 'full' || steps.meta.outputs.wanted == 'true'
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        id: install
        if: steps.mode.outputs.mode == 'full' || steps.meta.outputs.wanted == 'true'
        run: pnpm install --frozen-lockfile

      - name: Commit messages
        id: commitlint
        if: steps.mode.outputs.mode == 'full' && steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$SHA" --verbose

      - name: Dependency audit
        id: audit
        if: steps.mode.outputs.mode == 'full' && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm audit --audit-level moderate || true
          pnpm audit --audit-level critical

      - name: Prepare TypeScript environment
        if: steps.mode.outputs.mode == 'full' && steps.install.outcome == 'success'
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Prettier
        id: prettier
        if: steps.mode.outputs.mode == 'full' && steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm run check-format

      - name: ESLint
        id: eslint
        if: steps.mode.outputs.mode == 'full' && steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm run check-lint

      - name: TypeScript
        id: types
        if: steps.mode.outputs.mode == 'full' && steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm run check-types

      # The review bot uses the base branch's rules, so a PR can't loosen them for itself.
      - name: PR review
        id: review
        if: steps.mode.outputs.mode == 'full' && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          git fetch -q --no-tags origin "$BASE_REF"
          git checkout FETCH_HEAD -- .github/pr-review.config.json .github/scripts/pr-review
          node .github/scripts/pr-review/run.mjs \
            --base "origin/$BASE_REF" \
            --head HEAD \
            --config .github/pr-review.config.json \
            --output review-report.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.mode.outputs.mode == 'full'
        with:
          name: pr-review-report
          path: |
            review-report.md
            review-report.json
          if-no-files-found: ignore
          retention-days: 7

      # One build: with the preview's public env when this PR gets a preview, plain otherwise
      # (what the old pre-commit build did).
      - name: Build
        id: build
        if: >-
          steps.install.outcome == 'success' &&
          (steps.mode.outputs.mode == 'full' || steps.meta.outputs.wanted == 'true')
        continue-on-error: true
        env:
          WANTED: ${{ steps.meta.outputs.wanted }}
          HOST: ${{ steps.meta.outputs.host }}
          DOMAIN: ${{ steps.meta.outputs.domain }}
          CFG: ${{ steps.meta.outputs.cfg }}
        run: |
          if [ "$WANTED" = true ]; then
            {
              grep '^NEXT_PUBLIC_' "$CFG/preview.env"
              echo "NEXT_PUBLIC_API_URL=https://$HOST"
              echo "NEXT_PUBLIC_BASE_URL=https://$HOST/api/v1"
              echo "NEXT_PUBLIC_CONNECT_URL=wss://$HOST/centrifugo/connection/websocket"
              echo "NEXT_PUBLIC_CLIENT_URL=https://$PR.$DOMAIN"
            } > .env
          fi
          pnpm run build

      - name: Package preview image
        id: image
        if: steps.meta.outputs.wanted == 'true' && steps.build.outcome == 'success'
        env:
          CFG: ${{ steps.meta.outputs.cfg }}
        run: |
          [ -f .next/standalone/server.js ] || { echo "::error::No standalone output; next.config must keep output: standalone."; exit 1; }
          img="$RUNNER_TEMP/img"
          cp -r .next/standalone "$img"
          mkdir -p "$img/.next" "$img/public/mainapp/_next"
          cp -r .next/static "$img/.next/static"
          [ -d public ] && cp -r public/. "$img/public/"
          cp -r .next/static "$img/public/mainapp/_next/static"
          cp "$CFG/Dockerfile" "$img/Dockerfile"
          docker build -q -t fe-preview:local "$img"
          docker save fe-preview:local | gzip > image.tar.gz
          jq '.image = true' meta.json > meta.tmp && mv meta.tmp meta.json

      # Uploaded whenever previews are set up, even without an image: deploy uses meta.json to report
      # "no preview", an invalid Backend URL, or a failed build.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.meta.outputs.upload == 'true'
        with:
          name: fe-preview
          path: |
            meta.json
            image.tar.gz
          if-no-files-found: warn
          retention-days: 1

      - name: Results
        if: always() && steps.mode.outputs.mode == 'full'
        env:
          FILE_POLICY: ${{ steps.file_policy.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          HEURISTICS: ${{ steps.heuristics.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          COMMITLINT: ${{ steps.commitlint.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          PRETTIER: ${{ steps.prettier.outcome }}
          ESLINT: ${{ steps.eslint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          REVIEW: ${{ steps.review.outcome }}
          BUILD: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=0
          {
            echo "### PR checks for \`${SHA:0:7}\`"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          : > results.tsv
          row() { # context outcome
            local state desc
            case "$2" in
              success) state=success; desc="Passed" ;;
              failure) state=failure; desc="Failed; see the PR checks run"; failed=$((failed + 1)) ;;
              skipped)
                if [ "$INSTALL" = failure ]; then state=failure; desc="Not run: dependency install failed"; failed=$((failed + 1))
                else state=success; desc="Not needed for this event"; fi ;;
              *) state=failure; desc="${2:-not run}"; failed=$((failed + 1)) ;;
            esac
            printf '%s\t%s\t%s\n' "$1" "$state" "$desc" >> results.tsv
            echo "| $1 | $state: $desc |" >> "$GITHUB_STEP_SUMMARY"
          }
          row "File policy" "$FILE_POLICY"
          row "Gitleaks" "$GITLEAKS"
          row "Malware heuristics" "$HEURISTICS"
          row "Commit messages" "$COMMITLINT"
          row "Dependency audit" "$AUDIT"
          row "Prettier" "$PRETTIER"
          row "ESLint" "$ESLINT"
          row "TypeScript" "$TYPES"
          row "PR review" "$REVIEW"
          row "Build" "$BUILD"
          jq -Rn --arg sha "$SHA" --arg url "$RUN_URL" \
            '{sha: $sha, url: $url, checks: [inputs | split("\t") | {context: .[0], state: .[1], description: .[2]}]}' \
            < results.tsv > pr-checks-results.json
          echo "fail=$failed" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.mode.outputs.mode == 'full'
        with:
          name: pr-checks-results
          path: pr-checks-results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if a check failed
        if: always() && steps.mode.outputs.mode == 'full'
        run: |
          [ "${fail:-1}" = 0 ] || { echo "::error::${fail:-Some} check(s) failed; see the summary above."; exit 1; }
