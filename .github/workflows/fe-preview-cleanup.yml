name: FE preview cleanup

# Removes a PR's Coolify preview and image tags when it closes. The sweep (cron, and after preview
# deploys at most every 10 minutes) expires idle previews, starts queued ones and settles
# deployments the deploy job didn't see finish.
# Logic: .github/scripts/fe-preview.sh. Never checks out PR code. Inert until configured.

on:
  pull_request_target:
    branches:
      - dev
    types:
      - closed
  # GitHub drops scheduled runs under load (zero ran in this repo's first hours), so the sweep also
  # runs after every preview deploy. The cron, off the round minutes, covers quiet periods.
  workflow_run:
    workflows: ["FE preview deploy"]
    types:
      - completed
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      handoff:
        description: Set by a deploy-triggered run; re-checks the window before sweeping
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  packages: write
  statuses: write
  issues: write
  pull-requests: write

jobs:
  # Same lock as that PR's deploy and settle, so a close can't finish before a running deploy
  # creates the preview. If a deploy replaces this waiting job, the deploy sees the PR is closed and
  # cleans up itself.
  close:
    name: Remove closed PR's preview
    if: >-
      github.repository == 'zedu-hng/zedu-fe' && vars.COOLIFY_PREVIEW_APP != '' &&
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fe-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_PREVIEW_APP: ${{ vars.COOLIFY_PREVIEW_APP }}
      PREVIEW_CAP: ${{ vars.PREVIEW_CAP || '30' }}
      PREVIEW_TTL_HOURS: ${{ vars.PREVIEW_TTL_HOURS || '48' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false

      - name: Close
        env:
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/fe-preview.sh close "$PR"

  # A newer sweep replacing a waiting one is harmless, so all sweeps share one group. Deploy-triggered
  # runs only check the window and maybe dispatch, so they get their own group and never displace a
  # waiting sweep.
  sweep:
    name: Sweep previews
    if: >-
      github.repository == 'zedu-hng/zedu-fe' && vars.COOLIFY_PREVIEW_APP != '' &&
      github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fe-preview-sweep${{ github.event_name == 'workflow_run' && format('-handoff-{0}', github.run_id) || '' }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_PREVIEW_APP: ${{ vars.COOLIFY_PREVIEW_APP }}
      PREVIEW_CAP: ${{ vars.PREVIEW_CAP || '30' }}
      PREVIEW_TTL_HOURS: ${{ vars.PREVIEW_TTL_HOURS || '48' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false

      # Deploy-triggered sweeps: at most one per 10-minute window, to stay inside the token's API
      # budget. A cache entry per window marks "swept"; checking it costs no REST calls (the old
      # throttle listed recent runs and their jobs, dozens of calls per deploy). workflow_run runs can
      # only read caches, so on a miss this run dispatches the sweep (workflow_dispatch can write the
      # marker) instead of sweeping itself. The shared sweep group drops extra dispatches.
      - name: Window
        id: window
        run: echo "key=fe-preview-swept-$(( $(date +%s) / 600 ))" >> "$GITHUB_OUTPUT"

      # Deploy-triggered runs and their hand-offs check the window; scheduled and manual sweeps always
      # run. A hand-off re-checks because two deploys can both miss before the first sweep saves it.
      - name: Throttle
        id: throttle
        if: github.event_name == 'workflow_run' || inputs.handoff
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .swept
          key: ${{ steps.window.outputs.key }}
          lookup-only: true

      # If the dispatch itself fails, this run sweeps instead (it just can't save the marker). A
      # dispatched sweep that fails before saving leaves the window unmarked, so the next deploy
      # hands off again.
      - name: Hand off to a dispatched sweep
        id: handoff
        if: github.event_name == 'workflow_run' && steps.throttle.outputs.cache-hit != 'true'
        continue-on-error: true
        run: gh workflow run fe-preview-cleanup.yml --repo "$REPO" --ref dev -f handoff=true

      - name: Sweep
        if: >-
          (github.event_name != 'workflow_run' && steps.throttle.outputs.cache-hit != 'true') ||
          steps.handoff.outcome == 'failure'
        run: bash .github/scripts/fe-preview.sh sweep

      - name: Mark window swept
        if: github.event_name != 'workflow_run' && steps.throttle.outputs.cache-hit != 'true'
        run: touch .swept

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'workflow_run' && steps.throttle.outputs.cache-hit != 'true'
        with:
          path: .swept
          key: ${{ steps.window.outputs.key }}
