name: FE preview cleanup

# Removes a PR's Coolify preview and image tags when it closes. The sweep (cron, and after preview
# deploys at most every 10 minutes) expires idle previews, starts queued ones and settles
# deployments the deploy job didn't see finish.
# Logic: .github/scripts/fe-preview.sh. Never checks out PR code. Inert until configured.

on:
  pull_request_target:
    branches:
      - dev
    types:
      - closed
  # GitHub drops scheduled runs under load (zero ran in this repo's first hours), so the sweep also
  # runs after every preview deploy. The cron, off the round minutes, covers quiet periods.
  workflow_run:
    workflows: ["FE preview deploy"]
    types:
      - completed
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  statuses: write
  issues: write
  pull-requests: write

# Per PR for closes; sweeps share one group, where a newer sweep replacing a waiting one is harmless.
concurrency:
  group: fe-preview-cleanup-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean up previews
    if: github.repository == 'zedu-hng/zedu-fe' && vars.COOLIFY_PREVIEW_APP != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_PREVIEW_APP: ${{ vars.COOLIFY_PREVIEW_APP }}
      PREVIEW_CAP: ${{ vars.PREVIEW_CAP || '30' }}
      PREVIEW_TTL_HOURS: ${{ vars.PREVIEW_TTL_HOURS || '48' }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false

      - name: Clean up
        env:
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Deploy-triggered sweeps: at most one per 10 minutes, to stay inside the token's API budget.
          if [ "$EVENT" = workflow_run ]; then
            recent=$(gh api "repos/$REPO/actions/workflows/fe-preview-cleanup.yml/runs?status=success&per_page=10" \
              | jq --arg id "$RUN_ID" '[.workflow_runs[] | select((.id | tostring) != $id and ((.created_at | fromdateiso8601) > (now - 600)))] | length')
            [ "$recent" -eq 0 ] || { echo "A sweep ran in the last 10 minutes; skipping."; exit 0; }
          fi
          if [ -n "$PR" ]; then
            bash .github/scripts/fe-preview.sh close "$PR"
          else
            bash .github/scripts/fe-preview.sh sweep
          fi
