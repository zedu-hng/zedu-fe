name: FE preview deploy

# Trusted half of FE PR previews. Runs after "FE preview build" with the base repo's token and
# secrets; never checks out PR code. It recomputes the PR, gate and backend itself (the build's
# meta.json sits next to PR code, so it isn't trusted), pushes the built image to GHCR and asks
# Coolify to deploy it as a preview. Logic: .github/scripts/fe-preview.sh.
#
# Inert until configured: vars.COOLIFY_URL, vars.COOLIFY_PREVIEW_APP, secrets.COOLIFY_TOKEN.
# Optional: vars.PREVIEW_CAP (30), vars.PREVIEW_TTL_HOURS (48).

on:
  workflow_run:
    workflows: ["FE preview build"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  packages: write
  statuses: write
  issues: write
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  COOLIFY_URL: ${{ vars.COOLIFY_URL }}
  COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
  COOLIFY_PREVIEW_APP: ${{ vars.COOLIFY_PREVIEW_APP }}
  PREVIEW_CAP: ${{ vars.PREVIEW_CAP || '30' }}
  PREVIEW_TTL_HOURS: ${{ vars.PREVIEW_TTL_HOURS || '48' }}

jobs:
  # Finds the PR so later jobs can lock per PR. GitHub keeps only one waiting job per concurrency
  # group and cancels older ones, so a single global lock silently dropped deploys and settles.
  resolve:
    name: Resolve PR
    if: >-
      github.repository == 'zedu-hng/zedu-fe' && vars.COOLIFY_PREVIEW_APP != '' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false

      - name: Find PR
        id: pr
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "pr=$(bash .github/scripts/fe-preview.sh prnum "$SHA")" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy preview
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One writer per PR: a newer event for the same PR replacing a waiting one is what we want.
    concurrency:
      group: fe-preview-pr-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    outputs:
      deployment: ${{ steps.deploy.outputs.deployment }}
      pr: ${{ steps.deploy.outputs.pr }}
      sha: ${{ steps.deploy.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false

      # Skipped builds upload nothing; a missing artifact just means there's nothing to deploy.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: fe-preview
          path: ${{ runner.temp }}/artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Deploy
        id: deploy
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT: ${{ runner.temp }}/artifact
        run: |
          [ -f "$ARTIFACT/meta.json" ] || { echo "Build uploaded nothing; previews off or not needed."; exit 0; }
          image="$ARTIFACT/image.tar.gz"; [ -f "$image" ] || image=-
          # meta.json is untrusted; its backend host is only compared, never used.
          built=$(jq -r '.backend_host // empty' "$ARTIFACT/meta.json" 2>/dev/null || true)
          bash .github/scripts/fe-preview.sh deploy "$SHA" "$image" "$built"

  # A failed or cancelled build never reaches the deploy job; replace its pending "Building" status.
  build-end:
    name: Report unsuccessful build
    if: >-
      github.repository == 'zedu-hng/zedu-fe' && vars.COOLIFY_PREVIEW_APP != '' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false

      - name: Report
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: bash .github/scripts/fe-preview.sh buildend "$SHA" "$CONCLUSION" "$RUN_URL"

  # Waits without the lock, so a slow deployment doesn't hold up other PRs.
  watch:
    name: Wait for Coolify
    needs: deploy
    if: needs.deploy.outputs.deployment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.watch.outputs.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false

      - name: Watch deployment
        id: watch
        env:
          DEPLOYMENT: ${{ needs.deploy.outputs.deployment }}
        run: bash .github/scripts/fe-preview.sh watch "$DEPLOYMENT"

  # Writes Preview under the lock, and only if this deployment is still the PR's current one.
  settle:
    name: Settle preview status
    needs: [deploy, watch]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: fe-preview-pr-${{ needs.deploy.outputs.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false

      - name: Settle
        env:
          PR: ${{ needs.deploy.outputs.pr }}
          SHA: ${{ needs.deploy.outputs.sha }}
          DEPLOYMENT: ${{ needs.deploy.outputs.deployment }}
          RESULT: ${{ needs.watch.outputs.result }}
        run: bash .github/scripts/fe-preview.sh settle "$PR" "$SHA" "$DEPLOYMENT" "$RESULT"
