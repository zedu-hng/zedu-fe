name: PR Review recheck

# GitHub does not re-run pull_request workflows when the base branch changes, so a fix merged to
# dev would leave open PRs showing a stale, often false, "Structure, reuse, URLs, and secrets"
# failure until someone nudges the PR. On every push to a protected branch this re-runs the latest
# failed PR Review Bot run for each open PR, so the check reflects the new base.
#
# A re-run uses the workflow file from the original run's commit, so it only picks up the base
# branch's review rules for runs created after .github/workflows/pr-review.yml gained the
# "Use the base branch's review rules" step.

on:
  push:
    branches:
      - dev
      - central-staging
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: pr-review-recheck-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  recheck:
    name: Re-run stale reviews
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed reviews for open PRs
        run: |
          set -o pipefail
          # A fixed handful of list calls instead of one or two per open PR: open PR heads, the newest
          # failed / cancelled / timed-out review runs (filtered by the API, so age doesn't matter),
          # and the latest 100 review runs to spot heads that have since passed.
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.base.ref == "dev" or .base.ref == "central-staging") | "\(.head.sha) \(.number)"' > heads.txt
          runs="repos/$REPO/actions/workflows/pr-review.yml/runs?event=pull_request&per_page=100"
          for status in failure cancelled timed_out; do
            gh api "$runs&status=$status" --jq '.workflow_runs[] | "\(.head_sha) \(.id) \(.created_at)"'
          done | sort -k3 -r > failed.txt
          gh api "$runs" --jq '.workflow_runs[] | select(.conclusion != "failure" and .conclusion != "cancelled" and .conclusion != "timed_out") | "\(.head_sha) \(.created_at)"' > newer.txt
          # Newest failed run per open head, unless a later run for that head didn't fail.
          awk 'FILENAME == ARGV[1] { pr[$1] = $2; next }
               FILENAME == ARGV[2] { if (!($1 in ok) || $2 > ok[$1]) ok[$1] = $2; next }
               ($1 in pr) && !seen[$1]++ && !(($1 in ok) && ok[$1] > $3) { print pr[$1], $2 }' heads.txt newer.txt failed.txt |
          while read -r number run_id; do
            echo "PR #$number: re-running review run $run_id"
            gh run rerun "$run_id" --repo "$REPO" --failed || true
          done
