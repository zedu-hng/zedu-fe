name: PR Review recheck

# GitHub does not re-run pull_request workflows when the base branch changes, so a fix merged to
# dev would leave open PRs showing a stale, often false, "Structure, reuse, URLs, and secrets"
# failure until someone nudges the PR. On every push to a protected branch this re-runs the latest
# failed PR Review Bot run for each open PR, so the check reflects the new base.
#
# A re-run uses the workflow file from the original run's commit, so it only picks up the base
# branch's review rules for runs created after .github/workflows/pr-review.yml gained the
# "Use the base branch's review rules" step.

on:
  push:
    branches:
      - dev
      - central-staging
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: pr-review-recheck-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  recheck:
    name: Re-run stale reviews
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed reviews for open PRs
        run: |
          set -o pipefail
          # A few list calls instead of one or two per open PR: open PR heads, then the newest failed /
          # cancelled / timed-out review runs (filtered by the API, so age doesn't matter). Only for
          # open heads among those, one call each confirms the head's latest run is still the failed
          # one, so a failure that a newer run superseded is never re-run.
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.base.ref == "dev" or .base.ref == "central-staging") | "\(.head.sha) \(.number)"' > heads.txt
          runs="repos/$REPO/actions/workflows/pr-review.yml/runs?event=pull_request"
          for status in failure cancelled timed_out; do
            gh api "$runs&status=$status&per_page=100" --jq '.workflow_runs[].head_sha'
          done | sort -u > failed_heads.txt
          declare -A done_runs=()
          awk 'NR == FNR { f[$1] = 1; next } ($1 in f) { print $2, $1 }' failed_heads.txt heads.txt |
          while read -r number sha; do
            # Captured first: a failure inside a process substitution wouldn't stop the step.
            result=$(gh api "$runs&head_sha=$sha&per_page=1" --jq '.workflow_runs[0] | "\(.id) \(.conclusion // .status)"')
            read -r run_id conclusion <<< "$result"
            case "$conclusion" in
              failure|cancelled|timed_out)
                # PRs sharing a head share the run; re-run it once.
                [ -z "${done_runs[$run_id]:-}" ] || continue
                done_runs[$run_id]=1
                echo "PR #$number: re-running review run $run_id"
                gh run rerun "$run_id" --repo "$REPO" --failed || true ;;
              *) echo "PR #$number: latest review run $run_id is $conclusion; nothing to do" ;;
            esac
          done
