name: PR Review recheck

# GitHub does not re-run pull_request workflows when the base branch changes, so a fix merged to
# dev would leave open PRs showing a stale, often false, "Structure, reuse, URLs, and secrets"
# failure until someone nudges the PR. On every push to a protected branch this re-runs the latest
# failed PR Review Bot run for each open PR, so the check reflects the new base.
#
# A re-run uses the workflow file from the original run's commit, so it only picks up the base
# branch's review rules for runs created after .github/workflows/pr-review.yml gained the
# "Use the base branch's review rules" step.

on:
  push:
    branches:
      - dev
      - central-staging
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: pr-review-recheck-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  recheck:
    name: Re-run stale reviews
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed reviews for open PRs
        run: |
          set -o pipefail
          # Two list calls instead of one or two per open PR: open PR heads, then the latest 200 review
          # runs. A head whose newest review run failed gets that run re-run.
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.base.ref == "dev" or .base.ref == "central-staging") | "\(.head.sha) \(.number)"' > heads.txt
          for page in 1 2; do
            gh api "repos/$REPO/actions/workflows/pr-review.yml/runs?event=pull_request&per_page=100&page=$page" \
              --jq '.workflow_runs[] | "\(.head_sha) \(.id) \(.status) \(.conclusion // "")"'
          done > runs.txt
          # runs.txt is newest first, so the first line per head is its latest run.
          awk 'NR == FNR { pr[$1] = $2; next } ($1 in pr) && !seen[$1]++ { print pr[$1], $2, $3, $4 }' heads.txt runs.txt |
          while read -r number run_id status conclusion; do
            case "$status:$conclusion" in
              completed:failure|completed:cancelled|completed:timed_out)
                echo "PR #$number: re-running review run $run_id"
                gh run rerun "$run_id" --repo "$REPO" --failed || true ;;
              *) echo "PR #$number: review run $run_id is ${conclusion:-$status}; nothing to do" ;;
            esac
          done
